<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121110" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>VidMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('vidmind-theme');
          var allowed = ['white', 'black', 'dark-blue', 'brown', 'pink', 'blue-red', 'forest'];
          document.documentElement.setAttribute(
            'data-theme',
            allowed.indexOf(theme) >= 0 ? theme : 'brown'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'brown');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
